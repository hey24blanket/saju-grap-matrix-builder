<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SajuGrap Matrix Builder (360 Test Ver)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f5f3;
      --card-bg: #ffffff;
      --border: #202428;
      --mint: #7cd3b7;
      --mint-light: #e8f7f2;
      --lavender: #e2e1f9;
      --yellow: #fbf3d5;
      --text: #1e2227;
      --subtext: #636b74;
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; max-width: 1100px; margin: 0 auto; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-badge { display: flex; align-items: center; gap: 12px; }
    .avatar-circle { width: 44px; height: 44px; border: 2.5px solid var(--border); border-radius: 50%; background: var(--mint); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
    .title-text h1 { font-size: 20px; font-weight: 800; }
    .title-text p { font-size: 13px; color: var(--subtext); font-weight: 600; }

    .card { background: var(--card-bg); border: 2.5px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: 4px 4px 0px var(--border); }
    
    .key-input-area { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    textarea, input[type="text"], input[type="number"] { width: 100%; border: 2.5px solid var(--border); border-radius: 16px; padding: 14px; font-size: 13px; outline: none; background: #fff; }
    textarea { resize: vertical; min-height: 100px; }
    textarea:focus, input:focus { border-color: var(--mint); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: var(--card-bg); border: 2.5px solid var(--border); border-radius: 18px; padding: 18px; text-align: center; box-shadow: 3px 3px 0px var(--border); }
    .stat-card.mint { background: var(--mint-light); }
    .stat-card.lavender { background: var(--lavender); }
    .stat-card.yellow { background: var(--yellow); }
    .stat-value { font-size: 28px; font-weight: 800; margin-top: 6px; }
    .stat-label { font-size: 12px; font-weight: 700; color: var(--subtext); text-transform: uppercase; }

    .progress-container { margin: 16px 0; }
    .progress-bar-bg { width: 100%; height: 20px; background: #e0e0e0; border: 2.5px solid var(--border); border-radius: 999px; overflow: hidden; position: relative; }
    .progress-bar-fill { height: 100%; background: var(--mint); width: 0%; transition: width 0.3s ease; border-right: 2.5px solid var(--border); }

    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .btn { border: 2.5px solid var(--border); border-radius: 999px; padding: 12px 24px; font-size: 14px; font-weight: 800; cursor: pointer; transition: transform 0.1s; box-shadow: 2.5px 2.5px 0px var(--border); display: inline-flex; align-items: center; gap: 8px; }
    .btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--border); }
    .btn-primary { background: var(--mint); color: var(--text); }
    .btn-secondary { background: var(--card-bg); }
    .btn-accent { background: var(--yellow); }
    .btn-danger { background: #ffebeb; color: #d9534f; border-color: #d9534f; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .log-box { background: #1a1d20; color: #7cd3b7; font-family: monospace; font-size: 12px; padding: 16px; border-radius: 16px; border: 2.5px solid var(--border); height: 180px; overflow-y: auto; }
    .log-entry { margin-bottom: 4px; word-break: break-all; }
    .log-entry.error { color: #ff7b72; }

    .preview-card { border: 2px dashed var(--border); border-radius: 16px; padding: 16px; background: #fafafa; margin-top: 12px; }
    .preview-title { font-weight: 800; font-size: 14px; color: var(--text); margin-bottom: 8px; }
    .preview-body { font-size: 13px; color: var(--subtext); line-height: 1.6; }
    .preview-body p { margin-bottom: 6px; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
    .modal-card { background: var(--card-bg); border: 3px solid var(--border); border-radius: var(--radius); padding: 28px; width: 90%; max-width: 580px; box-shadow: 6px 6px 0px var(--border); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h3 { font-size: 18px; font-weight: 800; }
    .close-icon-btn { background: none; border: none; font-size: 20px; font-weight: 800; cursor: pointer; color: var(--text); }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-badge">
      <div class="avatar-circle">SG</div>
      <div class="title-text">
        <h1>SajuGrap 360 Test Compiler</h1>
        <p>5 Time-Scales × 5 Domains × 4 Wave Trends × 3 Energy Types</p>
      </div>
    </div>
    <button class="btn btn-secondary" onclick="openSettingsModal()">⚙️ 설정</button>
  </div>

  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚙️ 환경 설정</h3>
        <button class="close-icon-btn" onclick="closeSettingsModal()">✕</button>
      </div>

      <div class="key-input-area">
        <label style="font-size: 12px; font-weight: 800; color: var(--subtext);">Gemini API Key Pool (줄바꿈 구분)</label>
        <textarea id="apiKeysInput" placeholder="AIzaSy...&#10;AIzaSy..."></textarea>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px;">
          <div>
            <label style="font-size: 12px; font-weight: 800; color: var(--subtext);">ntfy 토픽명</label>
            <input type="text" id="ntfyTopicInput" placeholder="saju-grap-test-360" value="saju-grap-test-360">
          </div>
          <div>
            <label style="font-size: 12px; font-weight: 800; color: var(--subtext);">Gemini 모델명</label>
            <input type="text" id="modelInput" placeholder="gemini-2.0-flash" value="gemini-2.0-flash">
          </div>
        </div>

        <div style="margin-top: 4px;">
          <label style="font-size: 12px; font-weight: 800; color: var(--subtext);">API 키 1개당 분당 호출 수 (RPM)</label>
          <input type="number" id="rpmInput" placeholder="5" value="5" min="1" max="60">
        </div>
      </div>

      <div style="margin-top: 24px; text-align: right;">
        <button class="btn btn-primary" onclick="closeSettingsModal()">저장 및 닫기</button>
      </div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card mint">
      <div class="stat-label">진행률 (Progress)</div>
      <div class="stat-value" id="statProgress">0 / 360</div>
    </div>
    <div class="stat-card lavender">
      <div class="stat-label">활성 키 (Active Keys)</div>
      <div class="stat-value" id="statActiveKeys">0 개</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-label">성공 / 실패</div>
      <div class="stat-value" id="statStatus">0 / 0</div>
    </div>
  </div>

  <div class="card">
    <div class="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btnStart" onclick="startGeneration()">▶ 360개 생성 시작</button>
      <button class="btn btn-secondary" id="btnPause" onclick="pauseGeneration()" disabled>⏸ 일시정지</button>
      <button class="btn btn-accent" id="btnExportJSON" onclick="exportJSON()" disabled>💾 JSON 다운로드</button>
      <button class="btn btn-secondary" id="btnExportCSV" onclick="exportCSV()" disabled>📄 CSV 다운로드</button>
      <button class="btn btn-danger" onclick="clearDataOnly()">🗑 테스트 데이터 초기화</button>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 12px;">Real-time Live Log & Preview</h3>
    <div class="log-box" id="logBox">
      <div class="log-entry">[System] 테스트 360 레코드 빌더 준비 완료. '⚙️ 설정'에서 키 입력 후 생성 시작하세요.</div>
    </div>

    <div class="preview-card" id="previewCard" style="display:none;">
      <div class="preview-title" id="previewTitle">최신 생성 데이터 미리보기</div>
      <div class="preview-body" id="previewBody"></div>
    </div>
  </div>

  <script>
    const TOTAL_TARGET = 360;

    const timeScales = [
      { id: "hour", name: "시" },
      { id: "day", name: "일" },
      { id: "month", name: "월" },
      { id: "year", name: "연" },
      { id: "daewun", name: "대운" }
    ];

    const domains = [
      { id: "overall", name: "총운" },
      { id: "business", name: "사업운" },
      { id: "wealth", name: "재물운" },
      { id: "mental", name: "심신운" },
      { id: "love", name: "연애운" }
    ];

    const waveTrends = [
      { id: "trough", name: "바닥(충전기)" },
      { id: "rising", name: "반등(상승기)" },
      { id: "peak", name: "정점(과열/유지기)" },
      { id: "falling", name: "하락(조율기)" }
    ];

    const energyTypes = [
      { id: "T1_yang", name: "양적 추진형" },
      { id: "T2_yin", name: "음적 정의형" },
      { id: "T3_neutral", name: "중립 조율형" }
    ];

    let tasks = [];
    let completedResults = [];
    let isRunning = false;
    let successCount = 0;
    let errorCount = 0;

    function openSettingsModal() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettingsModal() { saveSettings(); document.getElementById('settingsModal').style.display = 'none'; }

    function saveSettings() {
      localStorage.setItem('saju_api_keys_360', document.getElementById('apiKeysInput').value);
      localStorage.setItem('saju_ntfy_topic_360', document.getElementById('ntfyTopicInput').value);
      localStorage.setItem('saju_model_name_360', document.getElementById('modelInput').value);
      localStorage.setItem('saju_rpm_limit_360', document.getElementById('rpmInput').value);
    }

    function loadSettings() {
      if (localStorage.getItem('saju_api_keys_360')) document.getElementById('apiKeysInput').value = localStorage.getItem('saju_api_keys_360');
      if (localStorage.getItem('saju_ntfy_topic_360')) document.getElementById('ntfyTopicInput').value = localStorage.getItem('saju_ntfy_topic_360');
      if (localStorage.getItem('saju_model_name_360')) document.getElementById('modelInput').value = localStorage.getItem('saju_model_name_360');
      if (localStorage.getItem('saju_rpm_limit_360')) document.getElementById('rpmInput').value = localStorage.getItem('saju_rpm_limit_360');
    }

    function buildTasks() {
      tasks = [];
      let seqNum = 1;
      timeScales.forEach(t => {
        domains.forEach(d => {
          waveTrends.forEach(w => {
            energyTypes.forEach(e => {
              tasks.push({
                no: seqNum,
                content_id: `${t.id}_${d.id}_${w.id}_${e.id}`,
                time_scale: t.name,
                time_scale_id: t.id,
                domain: d.name,
                domain_id: d.id,
                wave_trend: w.name,
                wave_trend_id: w.id,
                energy_type: e.name,
                energy_type_id: e.id
              });
              seqNum++;
            });
          });
        });
      });
    }

    function initStorage() {
      loadSettings();
      buildTasks();

      const saved = localStorage.getItem('saju_completed_data_360');
      if (saved) {
        completedResults = JSON.parse(saved);
        successCount = completedResults.length;
        const completedIds = new Set(completedResults.map(r => r.content_id));
        tasks = tasks.filter(t => !completedIds.has(t.content_id));
        log(`[System] 이전 저장 데이터 ${successCount}개 복구 완료. (남은 작업: ${tasks.length}개)`);
        
        if (completedResults.length > 0) {
          document.getElementById('btnExportJSON').disabled = false;
          document.getElementById('btnExportCSV').disabled = false;
        }
      }
      updateStatsOnly();
    }

    function log(msg, isError = false) {
      const logBox = document.getElementById('logBox');
      const entry = document.createElement('div');
      entry.className = `log-entry ${isError ? 'error' : ''}`;
      entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function getApiKeys() {
      const raw = document.getElementById('apiKeysInput').value;
      return raw.split('\n').map(k => k.trim()).filter(k => k.length > 10);
    }

    async function sendNtfyAlert(title, message) {
      const topic = document.getElementById('ntfyTopicInput').value.trim();
      if (!topic) return;
      try {
        const encodedTitle = `=?utf-8?b?${btoa(unescape(encodeURIComponent(title)))}?=`;
        await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: message,
          headers: { 'Title': encodedTitle }
        });
      } catch (e) {}
    }

    async function startGeneration() {
      const keys = getApiKeys();
      if (keys.length === 0) {
        alert("API 키를 설정해주세요.");
        openSettingsModal();
        return;
      }

      saveSettings();
      isRunning = true;
      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnPause').disabled = false;
      document.getElementById('statActiveKeys').innerText = `${keys.length} 개`;

      log(`360개 생성 시작 (남은 작업: ${tasks.length}개)`);
      sendNtfyAlert("SajuGrap 360 Builder", `작업이 시작되었습니다. (${tasks.length}개 처리 예정)`);

      keys.forEach((key, idx) => { runWorker(key, idx); });
    }

    function pauseGeneration() {
      isRunning = false;
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnPause').disabled = true;
      log("작업이 일시정지 되었습니다.");
    }

    async function callGeminiAPI(apiKey, task, retries = 3) {
      const modelName = document.getElementById('modelInput').value.trim() || 'gemini-2.0-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
      
      const prompt = `
너는 사주그랩(SajuGrap)의 AI 멘탈 뷰어 분석가다.
사용자가 그래프를 터치하며 [시/일/월/연/대운]으로 시간 축을 넓혀볼 때, 현재의 꺾임에 흔들리지 않고 거시적 흐름을 자각하도록 돕는 멘탈 가이드를 작성하라.

[분석 타겟 조건]
- 시간 축(time_scale): ${task.time_scale}
- 분석 영역(domain): ${task.domain}
- 파동 추세(wave_trend): ${task.wave_trend}
- 사주 성향(energy_type): ${task.energy_type}

[작성 지침]
1. macro_perspective(거시적 시각 전환): 단기 흐름(${task.time_scale})이 바닥/하락이더라도, 더 큰 파동(월, 연, 대운)에서는 어떻게 기운의 균형과 반등이 일어나는지 확신을 주는 시각 전환 멘트를 작성하라.
2. short_message: 그래프 상단 카드에 즉시 노출할 30자 이내의 임팩트 있는 한 줄 멘탈 요약.
3. 한국어 톤앤매너: 따뜻하면서도 명리적 기운 논리를 직관적으로 전달하는 서술.

[JSON 출력 format]
{
  "short_message": "그래프 상단 30자 이내 한 줄 요약",
  "diagnosis": "${task.time_scale} 단위에서 ${task.wave_trend} 상태에 놓인 ${task.energy_type}의 에너지를 정밀 진단 (60~80자)",
  "interpretation": "왜 현재 이러한 심리적/환경적 흐름이 형성되었는지 원인과 결과의 논리 해석 (100~120자)",
  "strategy": "현 파동 구간을 가장 지혜롭게 활용하기 위한 당장 실천할 행동 지침 (70~90자)",
  "caution": "완급 조절을 위한 주의사항 및 마인드셋 (50~70자)",
  "macro_perspective": "시간 축 확대 시 시각 전환 가이드 (현재 단기 파동과 상위 파동 간의 맥락 상기) (80~100자)"
}
`;

      for (let attempt = 1; attempt <= retries; attempt++) {
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { 
                response_mime_type: "application/json",
                temperature: 0.7 
              }
            })
          });

          if (!response.ok) {
            if ([500, 503, 429].includes(response.status) && attempt < retries) {
              await new Promise(r => setTimeout(r, 4000 * attempt));
              continue;
            }
            throw new Error(`HTTP Error: ${response.status}`);
          }

          const data = await response.json();
          const text = data.candidates[0].content.parts[0].text;
          return JSON.parse(text);
        } catch (err) {
          if (attempt === retries) throw err;
        }
      }
    }

    async function runWorker(apiKey, workerId) {
      const rpm = parseInt(document.getElementById('rpmInput').value) || 5;
      const delayMs = (60 / rpm) * 1000;

      while (isRunning && tasks.length > 0) {
        const task = tasks.shift();
        if (!task) break;

        try {
          const res = await callGeminiAPI(apiKey, task);
          const fullRecord = { ...task, ...res };
          
          completedResults.push(fullRecord);
          successCount++;

          localStorage.setItem('saju_completed_data_360', JSON.stringify(completedResults));
          updateUI(task, res);

          await new Promise(r => setTimeout(r, delayMs));
        } catch (err) {
          log(`[Worker ${workerId + 1}] 실패 (No.${task.no}): ${err.message}`, true);
          tasks.push(task);
          errorCount++;
          await new Promise(r => setTimeout(r, 3000));
        }
      }

      if (completedResults.length === TOTAL_TARGET) {
        log("🎉 360개 테스트 레코드 작업이 모두 완료되었습니다!");
        sendNtfyAlert("SajuGrap 360 완료", "🎉 360개 테스트 데이터 생성이 모두 완료되었습니다!");
        pauseGeneration();
      }
    }

    function updateStatsOnly() {
      const current = completedResults.length;
      const pct = ((current / TOTAL_TARGET) * 100).toFixed(1);
      document.getElementById('statProgress').innerText = `${current} / ${TOTAL_TARGET}`;
      document.getElementById('statStatus').innerText = `${successCount} / ${errorCount}`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    function updateUI(task, res) {
      updateStatsOnly();
      log(`[성공] No.${task.no} (${task.content_id})`);

      document.getElementById('previewCard').style.display = 'block';
      document.getElementById('previewTitle').innerText = `최신 데이터: No.${task.no} (${task.content_id})`;
      document.getElementById('previewBody').innerHTML = `
        <p style="color:var(--text); font-weight:800; font-size:14px; margin-bottom:8px;">💬 "${res.short_message}"</p>
        <p><b>🔍 진단:</b> ${res.diagnosis}</p>
        <p><b>💡 해석:</b> ${res.interpretation}</p>
        <p><b>🎯 전략:</b> ${res.strategy}</p>
        <p><b>⚠️ 완급조절:</b> ${res.caution}</p>
        <p style="color:#2b6cb0; background:#ebf8ff; padding:8px; border-radius:8px; margin-top:6px;"><b>🔭 시각 전환 (Macro Perspective):</b> ${res.macro_perspective}</p>
      `;

      document.getElementById('btnExportJSON').disabled = false;
      document.getElementById('btnExportCSV').disabled = false;
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(completedResults, null, 2)], { type: "application/json" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `saju_grap_360_test_records_${completedResults.length}.json`;
      a.click();
    }

    function exportCSV() {
      if (completedResults.length === 0) return;
      const headers = Object.keys(completedResults[0]).join(",");
      const rows = completedResults.map(row => 
        Object.values(row).map(val => `"${String(val).replace(/"/g, '""')}"`).join(",")
      );
      const csvContent = "\uFEFF" + [headers, ...rows].join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `saju_grap_360_test_records_${completedResults.length}.csv`;
      a.click();
    }

    function clearDataOnly() {
      if (confirm("생성된 360개 테스트 데이터 캐시를 초기화하시겠습니까?")) {
        localStorage.removeItem('saju_completed_data_360');
        completedResults = [];
        successCount = 0;
        errorCount = 0;
        buildTasks();
        updateStatsOnly();
        document.getElementById('previewCard').style.display = 'none';
        document.getElementById('btnExportJSON').disabled = true;
        document.getElementById('btnExportCSV').disabled = true;
        log("[System] 테스트 캐시 데이터가 초기화되었습니다.");
      }
    }

    window.onload = initStorage;
  </script>
